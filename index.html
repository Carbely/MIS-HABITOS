<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mis hábitos" />
<meta name="theme-color" content="#151020" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237c3aed'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white'%3E%E2%9C%93%3C/text%3E%3C/svg%3E" />
<title>Mis hábitos</title>
<style>
  :root {
    --bg: #151020;
    --card: #1f1830;
    --border: #332748;
    --purpleDark: #7c3aed;
    --pink: #f472b6;
    --text: #f1edf9;
    --textMuted: #9a8fb5;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 32px 16px 60px;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { color: var(--text); font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--textMuted); font-size: 14px; margin: 0 0 20px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  button { font-family: inherit; cursor: pointer; }
  .add-btn {
    background: linear-gradient(135deg, var(--purpleDark), var(--pink));
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  .empty {
    color: var(--textMuted);
    font-size: 14px;
    text-align: center;
    padding: 24px 0;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--textMuted);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
  }
  .chip.active {
    background: linear-gradient(135deg, var(--purpleDark), var(--pink));
    border-color: var(--pink);
    color: #fff;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .habit-name { color: var(--text); font-size: 15px; font-weight: 600; }
  .streak-text { color: var(--pink); font-size: 12px; margin-top: 2px; }
  .delete-btn { background: transparent; border: none; color: var(--textMuted); font-size: 14px; padding: 4px; }
  .stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-value { color: var(--pink); font-size: 20px; font-weight: 700; }
  .stat-label { color: var(--textMuted); font-size: 11px; margin-top: 2px; }
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 8px 0 12px; }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    width: 28px;
    height: 28px;
  }
  .month-label { color: var(--text); font-size: 14px; font-weight: 600; min-width: 140px; text-align: center; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekday-label { color: var(--textMuted); font-size: 11px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 12px;
  }
  .day-cell.checked {
    background: linear-gradient(135deg, var(--purpleDark), var(--pink));
    color: #fff;
    border-color: var(--pink);
  }
  .day-cell.today:not(.checked) { border-style: dashed; border-color: var(--pink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mis hábitos</h1>
  <p class="subtitle">Vista mensual: elige un hábito y marca los días cumplidos.</p>

  <div class="add-row">
    <input type="text" id="newHabitInput" placeholder="Nuevo hábito (ej: leer 20 min)" />
    <button class="add-btn" id="addBtn">Agregar</button>
  </div>

  <div id="emptyState" class="empty" style="display:none;">Aún no tienes hábitos. Agrega el primero arriba.</div>
  <div id="chips" class="chips"></div>
  <div id="cardArea"></div>
</div>

<script>
  const STORAGE_HABITS = "habits_v1";
  const STORAGE_LOGS = "logs_v1";
  const WEEKDAY_LABELS = ["L", "M", "M", "J", "V", "S", "D"];

  let habits = JSON.parse(localStorage.getItem(STORAGE_HABITS) || "[]");
  let logs = JSON.parse(localStorage.getItem(STORAGE_LOGS) || "{}");
  let selectedHabitId = habits[0]?.id || null;
  let cursor = { year: new Date().getFullYear(), month: new Date().getMonth() };

  function persist() {
    localStorage.setItem(STORAGE_HABITS, JSON.stringify(habits));
    localStorage.setItem(STORAGE_LOGS, JSON.stringify(logs));
  }

  function todayKeyFromDate(d) {
    return d.toISOString().slice(0, 10);
  }

  function monthLabel(year, month) {
    const s = new Date(year, month, 1).toLocaleDateString("es-CL", { month: "long", year: "numeric" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function buildMonthGrid(year, month) {
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startOffset = (firstDay.getDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let d = 1; d <= lastDay.getDate(); d++) cells.push(new Date(year, month, d));
    return cells;
  }

  function bestStreak(habitId) {
    const set = logs[habitId] || [];
    if (set.length === 0) return 0;
    const sorted = [...set].sort();
    let best = 1, current = 1;
    for (let i = 1; i < sorted.length; i++) {
      const diffDays = Math.round((new Date(sorted[i]) - new Date(sorted[i - 1])) / 86400000);
      if (diffDays === 1) { current += 1; best = Math.max(best, current); }
      else if (diffDays > 1) { current = 1; }
    }
    return best;
  }

  function completionRate(habitId, year, month) {
    const set = new Set(logs[habitId] || []);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const now = new Date();
    const isCurrentMonth = now.getFullYear() === year && now.getMonth() === month;
    const daysElapsed = isCurrentMonth ? now.getDate() : daysInMonth;
    let done = 0;
    for (let d = 1; d <= daysElapsed; d++) {
      const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      if (set.has(key)) done++;
    }
    return daysElapsed === 0 ? 0 : Math.round((done / daysElapsed) * 100);
  }

  const ICON_MAP = [
    { keywords: ["agua", "hidrat", "tomar agua"], icon: "💧" },
    { keywords: ["ejercicio", "gym", "gimnasio", "entrenar", "correr", "trotar"], icon: "🏃" },
    { keywords: ["leer", "lectura", "libro"], icon: "📖" },
    { keywords: ["dormir", "sueño", "descansar"], icon: "😴" },
    { keywords: ["medicamento", "pastilla", "remedio", "medicina"], icon: "💊" },
    { keywords: ["meditar", "meditaci", "respirar"], icon: "🧘" },
    { keywords: ["estudiar", "estudio", "tarea"], icon: "📚" },
    { keywords: ["caminar", "paseo"], icon: "🚶" },
    { keywords: ["comer", "comida", "sano", "saludable", "dieta"], icon: "🥗" },
    { keywords: ["vitamina"], icon: "🍊" },
    { keywords: ["escribir", "diario", "journal"], icon: "✍️" },
    { keywords: ["planificar", "planificación", "clase", "colegio"], icon: "🗂️" },
    { keywords: ["limpiar", "orden", "ordenar"], icon: "🧹" },
    { keywords: ["dinero", "ahorrar", "ahorro"], icon: "💰" },
    { keywords: ["fumar", "cigarro"], icon: "🚭" },
  ];

  function habitIcon(name) {
    const lower = name.toLowerCase();
    const match = ICON_MAP.find(entry => entry.keywords.some(k => lower.includes(k)));
    return match ? match.icon : "✅";
  }

  function addHabit() {
    const input = document.getElementById("newHabitInput");
    const name = input.value.trim();
    if (!name) return;
    const habit = { id: Date.now().toString(), name };
    habits.push(habit);
    if (!selectedHabitId) selectedHabitId = habit.id;
    input.value = "";
    persist();
    render();
  }

  function removeHabit(id) {
    habits = habits.filter(h => h.id !== id);
    delete logs[id];
    if (selectedHabitId === id) selectedHabitId = habits[0]?.id || null;
    persist();
    render();
  }

  function toggleDay(habitId, dateKey) {
    const set = new Set(logs[habitId] || []);
    if (set.has(dateKey)) set.delete(dateKey); else set.add(dateKey);
    logs[habitId] = Array.from(set);
    persist();
    render();
  }

  function changeMonth(delta) {
    let month = cursor.month + delta, year = cursor.year;
    if (month < 0) { month = 11; year -= 1; }
    else if (month > 11) { month = 0; year += 1; }
    cursor = { year, month };
    render();
  }

  function render() {
    document.getElementById("emptyState").style.display = habits.length === 0 ? "block" : "none";

    const chipsEl = document.getElementById("chips");
    chipsEl.innerHTML = "";
    habits.forEach(h => {
      const btn = document.createElement("button");
      btn.className = "chip" + (h.id === selectedHabitId ? " active" : "");
      btn.textContent = `${habitIcon(h.name)} ${h.name}`;
      btn.onclick = () => { selectedHabitId = h.id; render(); };
      chipsEl.appendChild(btn);
    });

    const cardArea = document.getElementById("cardArea");
    cardArea.innerHTML = "";
    const selectedHabit = habits.find(h => h.id === selectedHabitId);
    if (!selectedHabit) return;

    const selectedLogs = new Set(logs[selectedHabitId] || []);
    const cells = buildMonthGrid(cursor.year, cursor.month);
    const monthPrefix = `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}`;
    const monthCompletions = Array.from(selectedLogs).filter(k => k.startsWith(monthPrefix)).length;
    const todayStr = todayKeyFromDate(new Date());

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <div style="display:flex; align-items:flex-start; gap:10px;">
          <span style="font-size:26px; line-height:1;">${habitIcon(selectedHabit.name)}</span>
          <div>
            <div class="habit-name">${selectedHabit.name}</div>
            <div class="streak-text">${monthCompletions} día${monthCompletions === 1 ? "" : "s"} cumplidos este mes</div>
          </div>
        </div>
        <button class="delete-btn" id="deleteBtn">✕</button>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-value">${bestStreak(selectedHabit.id)}</div>
          <div class="stat-label">Mejor racha</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${completionRate(selectedHabit.id, cursor.year, cursor.month)}%</div>
          <div class="stat-label">Cumplimiento del mes</div>
        </div>
      </div>
      <div class="month-nav">
        <button class="nav-btn" id="prevMonth">‹</button>
        <span class="month-label">${monthLabel(cursor.year, cursor.month)}</span>
        <button class="nav-btn" id="nextMonth">›</button>
      </div>
      <div class="weekday-row">${WEEKDAY_LABELS.map(w => `<span class="weekday-label">${w}</span>`).join("")}</div>
      <div class="grid" id="dayGrid"></div>
    `;
    cardArea.appendChild(card);

    document.getElementById("deleteBtn").onclick = () => removeHabit(selectedHabit.id);
    document.getElementById("prevMonth").onclick = () => changeMonth(-1);
    document.getElementById("nextMonth").onclick = () => changeMonth(1);

    const dayGrid = document.getElementById("dayGrid");
    cells.forEach(date => {
      if (!date) { dayGrid.appendChild(document.createElement("div")); return; }
      const key = todayKeyFromDate(date);
      const checked = selectedLogs.has(key);
      const isToday = key === todayStr;
      const cell = document.createElement("button");
      cell.className = "day-cell" + (checked ? " checked" : "") + (isToday ? " today" : "");
      cell.textContent = date.getDate();
      cell.onclick = () => toggleDay(selectedHabit.id, key);
      dayGrid.appendChild(cell);
    });
  }

  document.getElementById("addBtn").onclick = addHabit;
  document.getElementById("newHabitInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addHabit();
  });

  render();
</script>
</body>
</html>
